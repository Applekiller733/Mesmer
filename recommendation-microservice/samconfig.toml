# SAM CLI configuration for the recommendation microservice stack. Deploy dev
# with `sam deploy` and prod with `sam deploy --config-env prod`.
#
# Db* values mirror the backend stack's samconfig.toml (same shared Aurora
# cluster). DotnetApiBaseUrl and MusicBrainzUserAgentContact are intentionally
# left empty here — fill them in before relying on the librosa audio fallback /
# to be polite to MusicBrainz (see README).
version = 0.1

# -----------------------------------------------------------------------------
# dev (default)
# -----------------------------------------------------------------------------
[default.global.parameters]
stack_name = "mesmer-recommendation-dev"

[default.build.parameters]
cached = true
parallel = true
use_container = true          # faithful manylinux wheels for the zip API build

[default.deploy.parameters]
stack_name = "mesmer-recommendation-dev"
region = "eu-north-1"
# Reuse the backend's pipeline artifacts bucket (same one its samconfig pins)
# instead of resolve_s3, so the CI pipeline execution role — scoped to just this
# bucket — can upload the zip artifact. resolve_s3 would need a different managed
# bucket the CI role can't create/write.
s3_bucket = "aws-sam-cli-managed-dev-pipeline-r-artifactsbucket-gwatphapijzt"
s3_prefix = "mesmer-recommendation-dev"
resolve_image_repos = true    # SAM-managed ECR repo for the batch image
capabilities = "CAPABILITY_NAMED_IAM"   # stack creates named roles (scheduler)
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "Stage=dev DbHost=mesmer-dev.cluster-cf00ui82uhlm.eu-north-1.rds.amazonaws.com DbClusterResourceId=cluster-757JB2FAFLQ66SIFSA5ALDE2YM DbName=postgres DbUser=postgres DotnetApiBaseUrl='https://roizb8t5sh.execute-api.eu-north-1.amazonaws.com' MusicBrainzUserAgentContact='zelu2728@gmail.com'"

# -----------------------------------------------------------------------------
# prod
# -----------------------------------------------------------------------------
[prod.global.parameters]
stack_name = "mesmer-recommendation-prod"

[prod.build.parameters]
cached = true
parallel = true
use_container = true

[prod.deploy.parameters]
stack_name = "mesmer-recommendation-prod"
region = "eu-north-1"
s3_bucket = "aws-sam-cli-managed-prod-pipeline--artifactsbucket-tumynqrwgkjs"
s3_prefix = "mesmer-recommendation-prod"
resolve_image_repos = true
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "Stage=prod DbHost=mesmer-prod.cluster-cf00ui82uhlm.eu-north-1.rds.amazonaws.com DbClusterResourceId=cluster-QCRGIODPFBEZ7F4HBN6VNPDSHA DbName=postgres DbUser=postgres DotnetApiBaseUrl='https://n8643uijf2.execute-api.eu-north-1.amazonaws.com' MusicBrainzUserAgentContact='zelu2728@gmail.com'"
