name: Deploy backend

# On push to main: run tests, deploy to dev automatically, then deploy to prod
# after a manual approval (configured via the GitHub "prod" environment's
# required reviewers). Path-filtered so frontend/recommendation-only changes
# don't trigger a backend deploy.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'template.yaml'
      - 'samconfig.toml'
  workflow_dispatch: {}

# Required for OIDC: the deploy jobs must be able to mint an id-token.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test backend/SongAppApi.sln --configuration Release

  deploy-dev:
    needs: test
    runs-on: ubuntu-latest
    # Uses the GitHub "dev" environment's secrets (its own bootstrap roles).
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Print OIDC subject (temporary)
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$IDTOKEN" | python3 -c "import sys,base64,json;p=sys.stdin.read().split('.')[1];p+='='*(-len(p)%4);print('SUB =',json.loads(base64.urlsafe_b64decode(p))['sub'])"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PIPELINE_EXECUTION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}
      - name: SAM build
        run: sam build --use-container
      - name: SAM deploy (dev)
        # Default samconfig env is dev; --role-arn passes the CloudFormation
        # execution role from `sam pipeline bootstrap`.
        run: >
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
          --role-arn ${{ secrets.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    # The GitHub "prod" environment gates this job — add required reviewers there
    # to make prod a manual approval, and give it its own bootstrap-role secrets.
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PIPELINE_EXECUTION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}
      - name: SAM build
        run: sam build --use-container
      - name: SAM deploy (prod)
        run: >
          sam deploy --config-env prod --no-confirm-changeset --no-fail-on-empty-changeset
          --role-arn ${{ secrets.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
