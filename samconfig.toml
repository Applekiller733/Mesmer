# SAM CLI configuration — committed so both local runs and CI deploy the same
# stack with the same settings. Select an environment with `--config-env`, e.g.
#   sam deploy --config-env prod
# The unqualified `default` environment is dev.
version = 0.1

# -----------------------------------------------------------------------------
# dev (default)
# -----------------------------------------------------------------------------
[default.global.parameters]
stack_name = "mesmer-backend-dev"

[default.build.parameters]
cached = true
parallel = true
use_container = true          # build inside the Lambda-like container for a faithful artifact

[default.deploy.parameters]
stack_name = "mesmer-backend-dev"
region = "eu-north-1"        # Stockholm; change to your chosen region
s3_bucket = "aws-sam-cli-managed-dev-pipeline-r-artifactsbucket-gwatphapijzt"
s3_prefix = "mesmer-backend-dev"
capabilities = "CAPABILITY_IAM"   # the stack creates the Lambda execution role
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "Stage=dev DbHost=mesmer-dev.cluster-cf00ui82uhlm.eu-north-1.rds.amazonaws.com DbClusterResourceId=cluster-757JB2FAFLQ66SIFSA5ALDE2YM DbName=postgres DbUser=postgres RecommendationBaseUrl=https://heq5e2p78b.execute-api.eu-north-1.amazonaws.com"

# -----------------------------------------------------------------------------
# prod
# -----------------------------------------------------------------------------
[prod.global.parameters]
stack_name = "mesmer-backend-prod"

[prod.build.parameters]
cached = true
parallel = true
use_container = true

[prod.deploy.parameters]
stack_name = "mesmer-backend-prod"
region = "eu-north-1"
s3_bucket = "aws-sam-cli-managed-prod-pipeline--artifactsbucket-tumynqrwgkjs"
s3_prefix = "mesmer-backend-prod"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "Stage=prod DbHost=mesmer-prod.cluster-cf00ui82uhlm.eu-north-1.rds.amazonaws.com DbClusterResourceId=cluster-QCRGIODPFBEZ7F4HBN6VNPDSHA DbName=postgres DbUser=postgres RecommendationBaseUrl="
