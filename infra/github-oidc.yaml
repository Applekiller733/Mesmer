AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Actions OIDC trust for deploying the Mesmer backend. Creates an IAM
  OIDC identity provider for token.actions.githubusercontent.com and an IAM role
  that only the configured GitHub repository (and, by default, only its main
  branch) can assume via a short-lived web-identity token — so no long-lived AWS
  keys are ever stored as GitHub secrets. Deploy this ONCE, out of band, before
  the CI/CD workflow can authenticate:
    aws cloudformation deploy \
      --template-file infra/github-oidc.yaml \
      --stack-name mesmer-github-oidc \
      --capabilities CAPABILITY_NAMED_IAM \
      --parameter-overrides GitHubOrg=Applekiller733 GitHubRepo=Mesmer
  Then copy the RoleArn output into the GitHub repo secret AWS_DEPLOY_ROLE_ARN.

Parameters:
  GitHubOrg:
    Type: String
    Default: Applekiller733
    Description: GitHub organization / user that owns the repository.
  GitHubRepo:
    Type: String
    Default: Mesmer
    Description: Repository name.
  SubjectClaim:
    Type: String
    Default: "repo:Applekiller733/Mesmer:ref:refs/heads/main"
    Description: >
      The exact `sub` claim the workflow's OIDC token carries — this is what the
      role trusts. The classic form is
      repo:ORG/REPO:ref:refs/heads/BRANCH. Repositories created after the July
      2026 immutable-claim change instead emit
      repo:ORG@ORG_ID/REPO@REPO_ID:ref:refs/heads/BRANCH — match whichever your
      repo actually emits (check a workflow run's token, or the GitHub docs).
      Use a StringLike wildcard (e.g. append :* ) only if you deliberately want
      to trust more than one branch/ref.
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: >
      If your account already has the token.actions.githubusercontent.com OIDC
      provider (only one is allowed per account), paste its ARN here and this
      stack will reuse it instead of creating a new one.

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS no longer validates this thumbprint for the GitHub provider, but the
      # property is still required by CloudFormation.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${GitHubRepo}-github-deploy
      Description: Role assumed by GitHub Actions (OIDC) to deploy the Mesmer backend.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # StringEquals (not ForAnyValue/ForAllValues) so the statement
                # can never pass when the claim is absent.
                token.actions.githubusercontent.com:sub: !Ref SubjectClaim
      Policies:
        - PolicyName: sam-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # --- CloudFormation: manage this project's stacks only ---
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource:
                  - !Sub arn:aws:cloudformation:*:${AWS::AccountId}:stack/mesmer-backend-*/*
                  - !Sub arn:aws:cloudformation:*:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
              - Sid: CloudFormationTransforms
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                Resource:
                  - arn:aws:cloudformation:*:aws:transform/Serverless-2016-10-31
              # --- SAM artifact bucket (resolve_s3 creates aws-sam-cli-managed-*) ---
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:PutBucketTagging
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - arn:aws:s3:::aws-sam-cli-managed-default*
                  - arn:aws:s3:::aws-sam-cli-managed-default*/*
              # --- Lambda function lifecycle ---
              - Sid: Lambda
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListVersionsByFunction
                  - lambda:PublishVersion
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:AddPermission
                  - lambda:RemovePermission
                Resource:
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:function:mesmer-backend-*
              # --- API Gateway v2 (HTTP API) ---
              - Sid: ApiGateway
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - arn:aws:apigateway:*::/apis
                  - arn:aws:apigateway:*::/apis/*
              # --- CloudWatch Logs group created by the stack ---
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:ListTagsForResource
                Resource:
                  - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/mesmer-backend-*
              # --- IAM: manage and pass ONLY the Lambda execution role the stack creates ---
              - Sid: ExecRoleManagement
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/mesmer-backend-*
              - Sid: PassExecRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/mesmer-backend-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              # --- S3 media bucket lifecycle (Phase 3.1) ---
              # Bucket-level config actions CloudFormation performs when creating,
              # updating, or deleting the mesmer-media-* bucket. Scoped to that
              # name prefix; object data is never touched by the deploy role.
              - Sid: MediaBucketManagement
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutBucketCORS
                  - s3:GetBucketCORS
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketOwnershipControls
                Resource:
                  - arn:aws:s3:::mesmer-media-*
              # NOTE: later Phase 3 steps (Aurora/RDS, Secrets Manager, VPC/EC2)
              # will require additional statements here — extend when those
              # resources are added to template.yaml.

Outputs:
  RoleArn:
    Description: Put this in the GitHub repo secret AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  OidcProviderArn:
    Description: ARN of the GitHub OIDC provider used by the role.
    Value: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
