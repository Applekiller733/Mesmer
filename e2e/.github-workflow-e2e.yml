name: E2E

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mesmer
          POSTGRES_PASSWORD: mesmer
          POSTGRES_DB: mesmer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesmer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # --- Backend ---
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build backend
        working-directory: backend
        run: |
          dotnet restore
          dotnet build --no-restore -c Release

      # Apply migrations and seed the two test accounts + sample songs.
      # Replace with your actual migration/seed commands.
      - name: Prepare test database
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: 'Host=localhost;Port=5432;Database=mesmer_test;Username=mesmer;Password=mesmer'
        run: |
          dotnet tool install --global dotnet-ef || true
          dotnet ef database update -c Release
          # psql -h localhost -U mesmer -d mesmer_test -f ../e2e/seed/test-seed.sql

      - name: Start backend
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: 'Host=localhost;Port=5432;Database=mesmer_test;Username=mesmer;Password=mesmer'
          ASPNETCORE_URLS: 'http://localhost:5041'
        run: |
          nohup dotnet run --no-build -c Release > backend.log 2>&1 &
          # Wait for the backend to answer.
          for i in $(seq 1 30); do
            curl -sf http://localhost:5041/ >/dev/null && break
            sleep 2
          done

      # --- Recommendation microservice ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start recommendation microservice
        working-directory: recommendation microservice
        run: |
          pip install -r requirements.txt || pip install fastapi uvicorn pydantic psycopg2-binary scikit-learn librosa
          nohup uvicorn api:app --host 0.0.0.0 --port 8000 > rec.log 2>&1 &
          sleep 5

      # --- Frontend ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and serve frontend
        working-directory: frontend
        env:
          VITE_API_URL: 'http://localhost:5041'
        run: |
          npm ci
          npm run build
          nohup npm run preview -- --port 5173 > frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ >/dev/null && break
            sleep 2
          done

      # --- E2E ---
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_BASE_URL: 'http://localhost:5173'
          E2E_API_URL: 'http://localhost:5041'
          CI: 'true'
        run: npm test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
